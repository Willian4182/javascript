<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Pares em um Vetor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <header>
        <h1>Lista de Exercícios - AULA 21/10/2024</h1>
        <h2>
            1. Números Pares em um Vetor crie um vetor com 10 números inteiros aleatórios (entre 1 e 100). Use um loop para percorrer o vetor e imprima apenas os números pares.
        </h2>
    </header>

    <button onclick="gerarNumeros()">Clique para gerar Números: </button>
    <div id="resultado"></div>

    
    <script> Ex1:
        function gerarNumeros() {
            const vetor = [];
            for (let i = 0; i < 10; i++) {
                vetor.push(Math.floor(Math.random() * 100) + 1);
            } 

            const pares = vetor.filter(num => num % 2 === 0);
            console.log("Vetor:", vetor); // Imprime o vetor no console
            console.log("Números Pares:", pares);
        }
    </script>    

</body>
</html>
